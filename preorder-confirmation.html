<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Thank You for Pre-ordering | Dreamz</title>
    <link rel="icon" type="image/x-icon" href="Photos/Brand/Favicons/favicon-light.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="Photos/Brand/Favicons/favicon-32-light.png">
    <link rel="apple-touch-icon" sizes="180x180" href="Photos/Brand/Favicons/apple-touch-icon-light.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: radial-gradient(circle at 50% 0%, #e4e2ea, #f7f6fa 52%, #ffffff);
            color: #0b0b10;
            font-family: 'Geist', sans-serif;
        }
        main {
            width: min(100%, 680px);
            padding: clamp(2rem, 7vw, 4.5rem);
            text-align: center;
            border: 1px solid rgba(11, 11, 16, .24);
            background: rgba(247, 246, 250, .72);
            box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
        }
        .brand, .eyebrow { font-family: 'Geist', monospace; letter-spacing: .16em; text-transform: uppercase; }
        .brand { margin: 0 0 4rem; color: #55535f; font-size: .8rem; }
        .check {
            width: 3.5rem;
            height: 3.5rem;
            display: grid;
            place-items: center;
            margin: 0 auto 1.5rem;
            border: 1px solid #5b2bd6;
            border-radius: 50%;
            color: #c7f9e5;
            font-size: 1.7rem;
        }
        .eyebrow { margin: 0 0 .8rem; color: #55535f; font-size: .65rem; }
        h1 { margin: 0; font: 400 clamp(2.6rem, 8vw, 4.5rem)/1 'Geist', serif; }
        p { max-width: 500px; margin: 1.4rem auto 0; color: #55535f; font-size: 1rem; line-height: 1.75; }
        .email-note { margin-top: 2.4rem; padding: 1.25rem; border: 1px solid rgba(11, 11, 16, .16); background: rgba(0, 0, 0, .14); }
        .email-note strong { color: #0b0b10; }
        a { display: inline-block; margin-top: 2.5rem; color: #0b0b10; font-size: .75rem; font-weight: 500; letter-spacing: .08em; text-decoration: none; text-transform: uppercase; }
        a:hover, a:focus-visible { color: #55535f; text-decoration: underline; }
        footer { width: min(100%, 680px); }
        .footer-disclaimer { max-width: none; margin: 0; padding-top: 1.25rem; border-top: 1px solid rgba(11, 11, 16, .1); color: rgba(11, 11, 16, .4); font-family: 'Geist', sans-serif; font-size: .7rem; line-height: 1.7; letter-spacing: .1em; text-align: left; text-transform: none; }
        .footer-disclaimer a { display: inline; margin: 0; color: rgba(11, 11, 16, .6); font-size: inherit; font-weight: inherit; letter-spacing: inherit; text-transform: none; text-decoration: underline; text-underline-offset: 2px; }
    </style>
    <link rel="stylesheet" href="assets/white-theme.css">
    <!-- Social share card (Photos/Brand/Social/Logo_social_share_1200x630.png) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Thank You for Pre-ordering | Dreamz">
    <meta property="og:site_name" content="Dreamz">
    <meta property="og:image" content="https://dreamz.rest/Photos/Brand/Social/Logo_social_share_1200x630.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Dreamz logo: three soft black waves meeting in a deep violet centre">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Thank You for Pre-ordering | Dreamz">
    <meta name="twitter:image" content="https://dreamz.rest/Photos/Brand/Social/Logo_social_share_1200x630.png">
    <meta name="twitter:image:alt" content="Dreamz logo: three soft black waves meeting in a deep violet centre">
</head>
<body>
  <div data-dreamz-nav></div>
    <main>
        <p class="brand">Dreamz</p>
        <div class="check" aria-hidden="true">✓</div>
        <p class="eyebrow">Pre-order confirmed</p>
        <h1>Thank you for pre-ordering Dreamz</h1>
        <p>Your payment confirmation is on its way.</p>
        <p class="email-note"><strong>Please check your email</strong> for your purchase verification, and check your <strong>spam folder</strong> too so you do not miss it.</p>
        <a href="index.html">Return to Dreamz</a>
    </main>
  <div data-dreamz-footer></div>
  <script src="assets/site-chrome.js"></script>
</body>
</html>
